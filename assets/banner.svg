<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Header Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#f43f5e;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f43f5e;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#38bdf8;#818cf8;#f43f5e" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Cone Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Alert Badge -->
    <linearGradient id="alertGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); letter-spacing: -1px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #64748b; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #f8fafc; letter-spacing: 0.5px; }
    .stat-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    .status-text { font-family: monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Border Gradient -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="210" r="180" fill="#f43f5e" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="80" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="160" fill="#818cf8" fill-opacity="0.07" filter="url(#glow)"/>

  <!-- ==================== RADAR SIMULATION (RIGHT SIDE) ==================== -->
  <g transform="translate(950, 210)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#64748b" stroke-width="1" stroke-opacity="0.8"/>

    <!-- Crosshairs -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Expanding Pulse Wave 1 -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="10;160" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="2.5;0.5" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Expanding Pulse Wave 2 -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="10;160" dur="4s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="4s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="2.5;0.5" dur="4s" begin="2s" repeatCount="indefinite" />
    </circle>

    <!-- Rotating Radar Sweep Beam -->
    <g>
      <path d="M 0 0 L 150 -50 A 160 160 0 0 1 160 0 Z" fill="url(#coneGrad)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" />
      </path>
      <line x1="0" y1="0" x2="160" y2="0" stroke="#f43f5e" stroke-width="2" filter="url(#softGlow)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Incident Radar Blips -->
    <g transform="translate(65, -45)">
      <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#f43f5e" stroke-width="1.5">
        <animate attributeName="r" values="6;18" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(-50, 70)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(-75, -60)">
      <circle cx="0" cy="0" r="4.5" fill="#fbbf24" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Radar Center Hub -->
    <circle cx="0" cy="0" r="7" fill="#f43f5e" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- ==================== LEFT SIDE HERO CONTENT ==================== -->
  <g transform="translate(70, 75)">
    <!-- Top Pill / Live Indicator -->
    <g transform="translate(0, 0)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#22c55e" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" class="status-text">CRITICAL EVENT MANAGEMENT</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" class="title">Awesome Critical Event</text>
      <text x="0" y="52" class="title">Management</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="162" class="subtitle">Ecosystem of Enterprise SaaS &amp; Open-Source Platforms</text>
    <text x="0" y="190" class="tagline">Crisis Response • Mass Notification • Incident Management • Public Safety • Resilience</text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1: Mass Notification -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="16" cy="17" r="4" fill="#f43f5e"/>
        <text x="28" y="22" class="badge-text">Mass Alerting</text>
      </g>

      <!-- Badge 2: Incident Response -->
      <g transform="translate(155, 0)">
        <rect width="160" height="34" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
        <text x="28" y="22" class="badge-text">Incident Response</text>
      </g>

      <!-- Badge 3: Situational Awareness -->
      <g transform="translate(325, 0)">
        <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="16" cy="17" r="4" fill="#818cf8"/>
        <text x="28" y="22" class="badge-text">Situational Awareness</text>
      </g>

      <!-- Badge 4: Business Continuity -->
      <g transform="translate(515, 0)">
        <rect width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
        <circle cx="16" cy="17" r="4" fill="#fbbf24"/>
        <text x="28" y="22" class="badge-text">Crisis &amp; BCM</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <line x1="70" y1="418" x2="1130" y2="418" stroke="url(#titleGrad)" stroke-width="2" stroke-opacity="0.8"/>
</svg>
